name: Questions
options:
  bundleIdPrefix: rocks.barry.questions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Simulator-first: a fresh clone builds with no provisioning profile.
    # `barry ios build --device` layers signing on as xcodebuild overrides.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Questions:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Questions
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The device path is real HTTPS with a real Let's Encrypt certificate,
        # so no ATS exception is needed for it. The one remaining plain-HTTP
        # caller is the SIMULATOR, which talks to the service on 127.0.0.1:3869 —
        # `NSAllowsLocalNetworking` permits exactly that and nothing routable,
        # so a mistyped http:// tailnet URL now fails loudly instead of
        # silently downgrading.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: rocks.barry.questions.app
  QuestionsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Questions
schemes:
  Questions:
    build:
      targets:
        Questions: all
        QuestionsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuestionsTests
