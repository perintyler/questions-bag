version: v0.1
name: questions
description: >-
  Ask the user a question and wait for the answer — with somewhere for it to
  land. Owns the store, a service the UIs can reach, macOS notifications with
  inline answer buttons, a native app, and a web page. Replaces the coding
  agent's built-in question picker, which only exists when someone is sitting
  at the terminal.

tools:
  entry: tools.ts

services:
  api:
    description: Questions store — pending questions, answers, and deadline enforcement
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    port: 3869
    health: /health
    # Reachable from a phone. The listener stays bound to loopback; Caddy
    # terminates on the tailnet and proxies here, which is how every other bag
    # is exposed (see point-guard, plans, metrics). A raw service port is NOT
    # reachable from a phone — bags/point-guard-ios points at one and its
    # device path has never worked.
    #
    # This widens who can reach the service, so `/config` was tightened in the
    # same change: a proxied request presents as loopback, and a socket-only
    # guard would have started serving BARRY_SECRET to the whole tailnet
    # without failing in any visible way. See server/src/loopback.ts.
    host: questions.barry.lan
    run-at-load: true
    keep-alive: true
    env:
      # The service is the only writer the app and the web page can reach, so
      # it must come up with the same secret they send. Listed here means
      # REQUIRED: a doctor run flags it if a barry has not bound it.
      - BARRY_SECRET

apps:
  Questions:
    description: Answer questions from agent sessions
    platform: macos
    build:
      command: questions-app/build.sh
      output: questions-app/.build/Questions.app
    bundle-id: com.barry.questions
    # The notification and the web page deep-link to a single question rather
    # than dumping the reader in a list they have to search.
    url-schemes: [barry-question]
    # Not a login item. Answering is occasional work and the notification is
    # the entry point, so the app opens on demand and quits with its window —
    # same posture as BarryIdentities and Plans, for the same reason.
    login-item: false

  QuestionsiOS:
    description: Answer questions from a phone, away from the Mac
    platform: ios
    project: questions-ios
    scheme: Questions
    bundle-id: rocks.barry.questions.app
    # No paid-only entitlements (no app groups, push, or keychain sharing), so
    # a free personal team can sign this for a device. The cost is that it
    # cannot receive a push: it only shows a question while it is open.
    device: true

# No `traits:` block. The auto-trait `questions` (readwrite over the namespace)
# is exactly right, and declaring it by hand would duplicate the name and make
# it ambiguous which definition applies.
